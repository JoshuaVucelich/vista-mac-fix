version="1.0.2"
displayName="Vista Mac Fix"
authors="Joshua Vucelich"
description='''Client-only. On macOS, redirects Sodium and Sable glCopyBufferSubData calls through a CPU copy so Apple OpenGL does not abort. Other systems keep the original GL call.'''

