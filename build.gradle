plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    probe
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            // This VM is not a Mac. The property turns the same CPU path on.
            systemProperty 'vista_mac_fix.force', 'true'
            if (project.hasProperty('dhProbe')) {
                systemProperty 'vista_mac_fix.dhProbe', 'true'
                systemProperty 'vista_mac_fix.dhProbeExit', 'true'
                systemProperty 'vista_mac_fix.dhProbeFile', file('run/dh-probe.txt').absolutePath
            }
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            // Dev runs only. The jar task still packages the main source set,
            // so DhFeedProbe stays out of the release jar.
            sourceSet(sourceSets.probe)
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    // Mojmap jars used only to compile the television mixin against Vista
    // 4.4.11. They are not shipped inside this mod. Version ids select the
    // NeoForge files; the shared version numbers also publish Fabric jars.
    compileOnly "maven.modrinth:vista_tv:XDmEbLHW"
    compileOnly "maven.modrinth:moonlight:fAIfWX6M"
    // DH 3.0.3-b API, used to compile the before-render bind. Not shipped.
    compileOnly "maven.modrinth:distanthorizons:oYXIfeus"
    probeCompileOnly sourceSets.main.output
    probeCompileOnly "maven.modrinth:distanthorizons:oYXIfeus"
    probeCompileOnly 'org.slf4j:slf4j-api:2.0.9'
    testImplementation "maven.modrinth:vista-aeronautics-fix:q4MJ1X5o"
    testImplementation 'org.slf4j:slf4j-api:2.0.9'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.ow2.asm:asm:9.7'
    testImplementation 'org.ow2.asm:asm-tree:9.7'
    def mixinJar = configurations.compileClasspath.files.find { it.name.contains('sponge-mixin') }
    if (mixinJar != null) {
        testImplementation files(mixinJar)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('test', Test) {
    useJUnitPlatform()
    def dhJar = configurations.compileClasspath.files.find { it.name.toLowerCase().contains('distanthorizon') }
    if (dhJar != null) {
        systemProperty 'vista.dh.jar', dhJar.absolutePath
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes(
                'Specification-Title': 'Vista Mac Fix',
                'Specification-Vendor': 'Joshua Vucelich',
                'Implementation-Title': 'vista_mac_fix',
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'Joshua Vucelich',
                'Built-On': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        )
    }
}
